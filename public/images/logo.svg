<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#E5D3B3" />
      <stop offset="100%" stop-color="#9A7B56" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(197, 168, 128, 0)" />
      <stop offset="50%" stop-color="rgba(197, 168, 128, 0.3)" />
      <stop offset="100%" stop-color="rgba(197, 168, 128, 0)" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Circular Frame -->
    <circle cx="160" cy="160" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="800 150" transform="rotate(-45 160 160)" />
    <circle cx="160" cy="160" r="145" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="150 800" transform="rotate(-45 160 160)" />

    <!-- Wall Printer Graphic -->
    <g transform="translate(30, 70)">
      <rect x="25" y="10" width="8" height="180" fill="url(#darkGrad)" rx="2" />
      <rect x="35" y="10" width="4" height="180" fill="url(#goldGrad)" rx="1" />
      <rect x="15" y="80" width="28" height="35" fill="#1A1A1A" rx="4" stroke="url(#goldGrad)" stroke-width="1.5" />
      <circle cx="29" cy="98" r="4" fill="#3B82F6" />
      <polygon points="29,102 10,130 50,130" fill="url(#glowGrad)" />
      <rect x="10" y="190" width="38" height="12" fill="#1A1A1A" rx="3" />
      <circle cx="18" cy="202" r="6" fill="#333" stroke="url(#goldGrad)" stroke-width="1" />
      <circle cx="40" cy="202" r="6" fill="#333" stroke="url(#goldGrad)" stroke-width="1" />
      <path d="M 50,90 Q 75,70 85,95 Q 70,120 50,90 Z" fill="url(#goldGrad)" opacity="0.4" />
      <path d="M 50,110 Q 80,95 95,120 Q 75,145 50,110 Z" fill="url(#goldGrad)" opacity="0.6" />
      <path d="M 55,130 Q 90,120 100,150 Q 80,175 55,130 Z" fill="url(#goldGrad)" opacity="0.8" />
    </g>

    <!-- Large SV Monogram -->
    <g transform="translate(100, 20)">
      <text x="35" y="200" font-family="'Cinzel', 'Didot', 'Playfair Display', 'Georgia', serif" font-size="190" font-weight="400" fill="#222" letter-spacing="-5">S</text>
      <text x="110" y="215" font-family="'Cinzel', 'Didot', 'Playfair Display', 'Georgia', serif" font-size="190" font-weight="300" fill="url(#goldGrad)" letter-spacing="-5">V</text>
    </g>
  </g>

  <!-- Text Brand Content -->
  <g transform="translate(460, 20)">
    <text x="0" y="110" font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="62" font-weight="500" fill="#1A1A1A" letter-spacing="12">
      <tspan fill="url(#goldGrad)">SV</tspan> WALLS
    </text>
    <line x1="-5" y1="155" x2="110" y2="155" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="140" y="165" font-family="'Montserrat', 'Inter', 'Georgia', serif" font-size="30" font-weight="300" fill="#1A1A1A" letter-spacing="12">VERTICAL</text>
    <line x1="390" y1="155" x2="505" y2="155" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="-5" y1="215" x2="35" y2="215" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="50" y="222" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#222" letter-spacing="12">WALL PRINTING SOLUTIONS</text>
    <line x1="465" y1="215" x2="505" y2="215" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="70" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#666" letter-spacing="8">
      PRINT  <tspan fill="url(#goldGrad)">|</tspan>  TRANSFORM  <tspan fill="url(#goldGrad)">|</tspan>  INSPIRE
    </text>
  </g>
</svg>
